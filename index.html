<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Tracker - x, y, roll, pitch</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #stage {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 4px solid #2a2a2a;
    transition: border-color 0.15s;
  }
  #stage.warn { border-color: #ff3b30; }
  video, canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* 거울 모드 */
  }
  #warning {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: #ff3b30;
    color: #fff;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    display: none;
    z-index: 5;
    white-space: nowrap;
  }
  #stage.warn #warning { display: block; animation: blink 0.6s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }
  #info {
    width: 100%;
    max-width: 640px;
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .card {
    background: #1c1c1e;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .card .label { font-size: 12px; color: #999; }
  .card .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #status { margin-top: 10px; font-size: 14px; color: #aaa; text-align: center; }
  #settings { margin-top: 10px; font-size: 13px; color: #aaa; }
  #settings input { vertical-align: middle; }
</style>
</head>
<body>
  <h1>얼굴 위치 추적 (x, y, roll, pitch)</h1>

  <div id="stage">
    <div id="warning">⚠ 얼굴이 너무 가깝습니다! 뒤로 물러나세요</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="info">
    <div class="card"><div class="label">x (좌우)</div><div class="value" id="vx">-</div></div>
    <div class="card"><div class="label">y (상하)</div><div class="value" id="vy">-</div></div>
    <div class="card"><div class="label">roll (기울기°)</div><div class="value" id="vroll">-</div></div>
    <div class="card"><div class="label">pitch (끄덕임°)</div><div class="value" id="vpitch">-</div></div>
  </div>

  <div id="status">모델 불러오는 중...</div>

  <div id="settings">
    경고 기준 (얼굴 너비 비율):
    <input type="range" id="threshold" min="0.2" max="0.8" step="0.01" value="0.45">
    <span id="thVal">0.45</span>
  </div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
const thInput = document.getElementById("threshold");
const thVal = document.getElementById("thVal");

const vx = document.getElementById("vx");
const vy = document.getElementById("vy");
const vroll = document.getElementById("vroll");
const vpitch = document.getElementById("vpitch");

let threshold = parseFloat(thInput.value);
thInput.addEventListener("input", () => {
  threshold = parseFloat(thInput.value);
  thVal.textContent = threshold.toFixed(2);
});

const RAD2DEG = 180 / Math.PI;

let faceLandmarker;
let lastVideoTime = -1;

async function init() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 5, // 여러 얼굴을 감지한 뒤 가장 가까운 한 명만 사용
    outputFacialTransformationMatrixes: true
  });

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: "user" },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => (video.onloadedmetadata = r));
  await video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  statusEl.textContent = "얼굴을 카메라에 비춰주세요";
  requestAnimationFrame(loop);
}

// 얼굴 너비(양쪽 광대 landmark 234, 454) → 가까울수록 값이 커짐
function faceWidth(lm) {
  const a = lm[234], b = lm[454];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function loop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = faceLandmarker.detectForVideo(video, performance.now());
    draw(result);
  }
  requestAnimationFrame(loop);
}

function draw(result) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const faces = result.faceLandmarks || [];

  if (faces.length === 0) {
    vx.textContent = vy.textContent = vroll.textContent = vpitch.textContent = "-";
    stage.classList.remove("warn");
    statusEl.textContent = "얼굴이 감지되지 않았습니다";
    return;
  }

  // 가장 가까운(=얼굴 너비가 가장 큰) 얼굴 하나만 선택
  let best = 0, bestW = -1;
  faces.forEach((lm, i) => {
    const w = faceWidth(lm);
    if (w > bestW) { bestW = w; best = i; }
  });
  const lm = faces[best];

  // x, y: 코 끝(landmark 1) 기준, 화면 중앙 = 0, 범위 -100 ~ +100
  // 거울 모드이므로 오른쪽으로 가면 +x, 위로 가면 +y
  const nose = lm[1];
  const x = (0.5 - nose.x) * 200;
  const y = (0.5 - nose.y) * 200;

  // roll: 두 눈 바깥쪽 끝(33, 263)을 잇는 선의 기울기
  const eyeR = lm[33], eyeL = lm[263];
  const roll = Math.atan2(
    (eyeL.y - eyeR.y) * canvas.height,
    (eyeL.x - eyeR.x) * canvas.width
  ) * RAD2DEG;

  // pitch: facial transformation matrix (4x4, column-major)에서 추출
  let pitch = 0;
  const mat = result.facialTransformationMatrixes?.[best]?.data;
  if (mat) {
    pitch = Math.atan2(-mat[6], mat[10]) * RAD2DEG;
  }

  vx.textContent = x.toFixed(1);
  vy.textContent = y.toFixed(1);
  vroll.textContent = roll.toFixed(1);
  vpitch.textContent = pitch.toFixed(1);

  // 너무 가까우면 경고
  const tooClose = bestW > threshold;
  stage.classList.toggle("warn", tooClose);

  statusEl.textContent =
    `감지된 얼굴 ${faces.length}명 중 가장 가까운 1명 추적 중 (얼굴 너비 비율 ${bestW.toFixed(2)})`;

  // 가장 가까운 얼굴에만 박스 표시
  let minX = 1, minY = 1, maxX = 0, maxY = 0;
  for (const p of lm) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  ctx.lineWidth = 3;
  ctx.strokeStyle = tooClose ? "#ff3b30" : "#34c759";
  ctx.strokeRect(
    minX * canvas.width, minY * canvas.height,
    (maxX - minX) * canvas.width, (maxY - minY) * canvas.height
  );
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.arc(nose.x * canvas.width, nose.y * canvas.height, 5, 0, Math.PI * 2);
  ctx.fill();
}

init().catch(err => {
  console.error(err);
  statusEl.textContent = "오류: " + err.message + " (카메라 권한과 HTTPS 환경을 확인하세요)";
});
</script>
</body>
</html>
